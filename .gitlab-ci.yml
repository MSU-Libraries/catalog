stages:
  - test
  - Build
  - Deploy
  - Deploy Prod
  - Optional Steps
  - Cleanup
  - Release

variables:
  VUFIND_VERSION: "11.0.4"
  SIMPLESAMLPHP_VERSION: "2.1.1"
  COMPOSE_PATH: /home/deploy/$STACK_NAME
  SSH_USER: "deploy"
  ENV_BRANCH_NAME: ${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}${CI_COMMIT_BRANCH}

Set Stack Name:
  stage: test
  environment:
    name: $ENV_BRANCH_NAME
    url: $URL
    on_stop: Remove Environment
  interruptible: true
  timeout: 2m
  variables:
    PROD: "false"
  tags:
    - msul-shared
  rules:
    - if: '($ENV_BRANCH_NAME == $CI_DEFAULT_BRANCH ||  $ENV_BRANCH_NAME == "catprod-preview" || $ENV_BRANCH_NAME =~ /^devel-/ || $ENV_BRANCH_NAME =~ /^review-/) && $PROD == "false"'
    - if: '$ENV_BRANCH_NAME == $CI_DEFAULT_BRANCH && $PROD == "true"'
      when: manual
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  before_script:
    - apk add --no-cache bash
  script:
    - bash ./cicd/set-stack-name
  artifacts:
    reports:
      dotenv: build.env
      metrics: metrics.txt

Create DNS:
  extends: .stack_template
  environment:
    name: $ENV_BRANCH_NAME/create-dns
    auto_stop_in: 2 weeks
  image: $CI_REGISTRY_IMAGE/ansible:latest
  rules:
    - if: '($ENV_BRANCH_NAME =~ /^devel-/ || $ENV_BRANCH_NAME =~ /^review-/) && $CI_PIPELINE_SOURCE != "schedule"'
  needs:
    - job: Set Stack Name
      artifacts: true
  script:
    - ./cicd/create-dns

Deploy Compose Files:
  extends: .stack_template
  environment:
    name: $ENV_BRANCH_NAME/deploy-compose
    auto_stop_in: 2 weeks
  rules:
    - if: '$ENV_BRANCH_NAME == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
    - if: '$ENV_BRANCH_NAME =~ /^devel-/ || $ENV_BRANCH_NAME =~ /^review-/ ||  $ENV_BRANCH_NAME == "catprod-preview"'
  needs:
    - job: Set Stack Name
      artifacts: true
  script:
    - bash ./cicd/deploy-compose-files
  artifacts:
    reports:
      metrics: metrics.txt
    paths:
      - ${CI_JOB_STAGE// /_}_start.txt

Initialize Log Dirs:
  extends: .stack_template
  environment:
    name: $ENV_BRANCH_NAME/init-logs
    auto_stop_in: 2 weeks
  script:
     - bash ./cicd/initialize-log-dirs

Deploy Internal Network:
  extends: .stack_template
  environment:
    name: $ENV_BRANCH_NAME/deploy-network
    auto_stop_in: 2 weeks
  script:
    - bash ./cicd/deploy-internal-network
  needs:
    - Deploy Compose Files
    - job: Set Stack Name
      artifacts: true

Bootstrap Stacks:
  extends: .stack_template
  environment:
    name: $ENV_BRANCH_NAME/bootstrap
    auto_stop_in: 2 weeks
  needs:
    - job: Set Stack Name
      artifacts: true
    - Deploy Compose Files
    - Deploy Internal Network
    - Build DB Image
    - Build ZK Image
  script:
    - bash ./cicd/bootstrap-stacks

Deploy ZK:
  extends: .stack_template
  environment:
    name: $ENV_BRANCH_NAME/deploy-zk
    auto_stop_in: 2 weeks
  rules:
    - if: '$ENV_BRANCH_NAME == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
    - if: '$ENV_BRANCH_NAME =~ /^devel-/ || $ENV_BRANCH_NAME =~ /^review-/ ||  $ENV_BRANCH_NAME == "catprod-preview"'
  needs:
    - job: Set Stack Name
      artifacts: true
    - Bootstrap Stacks
    - Deploy Compose Files
    - Deploy Internal Network
    - Initialize Log Dirs
  script:
    - bash ./cicd/deploy-zk

Deploy Solr:
  extends: .stack_template
  environment:
    name: $ENV_BRANCH_NAME/deploy-solr
    auto_stop_in: 2 weeks
  rules:
    - if: '$ENV_BRANCH_NAME == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
    - if: '$ENV_BRANCH_NAME =~ /^devel-/ || $ENV_BRANCH_NAME =~ /^review-/ ||  $ENV_BRANCH_NAME == "catprod-preview"'
  needs:
    - job: Set Stack Name
      artifacts: true
    - Build Solr Image
    - Deploy ZK
    - Bootstrap Stacks
    - Deploy Compose Files
    - Deploy Internal Network
    - Initialize Log Dirs
  script:
    - bash ./cicd/deploy-solr

Create Solr Collections:
  extends: .stack_template
  environment:
    name: $ENV_BRANCH_NAME/create-solr-colls
    auto_stop_in: 2 weeks
  rules:
    - if: '$ENV_BRANCH_NAME == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
    - if: '$ENV_BRANCH_NAME =~ /^devel-/ || $ENV_BRANCH_NAME =~ /^review-/ ||  $ENV_BRANCH_NAME == "catalog-preview"'
  needs:
    - job: Set Stack Name
      artifacts: true
    - job: Deploy Compose Files
      artifacts: true
    - Deploy Solr
  script:
    - bash ./cicd/create-solr-collections

Deploy DB:
  extends: .stack_template
  environment:
    name: $ENV_BRANCH_NAME/deploy-db
    auto_stop_in: 2 weeks
  rules:
    - if: '$ENV_BRANCH_NAME == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
    - if: '$ENV_BRANCH_NAME =~ /^devel-/ || $ENV_BRANCH_NAME =~ /^review-/ ||  $ENV_BRANCH_NAME == "catprod-preview"'
  needs:
    - job: Set Stack Name
      artifacts: true
    - Build DB Image
    - Bootstrap Stacks
    - Deploy Compose Files
    - Deploy Internal Network
    - Initialize Log Dirs
  script:
    - bash ./cicd/deploy-db

Deploy Redis:
  extends: .stack_template
  environment:
    name: $ENV_BRANCH_NAME/deploy-redis
    auto_stop_in: 2 weeks
  timeout: 60m
  rules:
    - if: '$ENV_BRANCH_NAME == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
    - if: '$ENV_BRANCH_NAME =~ /^devel-/ || $ENV_BRANCH_NAME =~ /^review-/ ||  $ENV_BRANCH_NAME == "catprod-preview"'
  needs:
    - job: Set Stack Name
      artifacts: true
    - Deploy Internal Network
  script:
    - bash ./cicd/deploy-redis

Deploy Vufind:
  extends: .stack_template
  environment:
    name: $ENV_BRANCH_NAME/deploy-vufind
    auto_stop_in: 2 weeks
  timeout: 60m
  rules:
    - if: '$ENV_BRANCH_NAME == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
    - if: '$ENV_BRANCH_NAME =~ /^devel-/ || $ENV_BRANCH_NAME =~ /^review-/ ||  $ENV_BRANCH_NAME == "catprod-preview"'
  needs:
    - job: Set Stack Name
      artifacts: true
    - Build Captcha Image
    - Build Vufind Image
    - Verify DB Health
    - Verify Solr Health
  script:
    - bash ./cicd/deploy-vufind
  artifacts:
    reports:
      dotenv: deploy.env
      metrics: metrics.txt

Deploy Vufind Build Env:
  extends: .stack_template
  stage: Optional Steps
  environment:
    name: $ENV_BRANCH_NAME/deploy-buildenv
    auto_stop_in: 2 weeks
  rules:
    - if: '$ENV_BRANCH_NAME == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
    - if: '$ENV_BRANCH_NAME =~ /^devel-/ || $ENV_BRANCH_NAME =~ /^review-/ ||  $ENV_BRANCH_NAME == "catprod-preview"'
      when: manual
  needs:
    - job: Set Stack Name
      artifacts: true
    - Deploy Vufind
  script:
    - bash ./cicd/deploy-vufind-build
  artifacts:
    reports:
      dotenv: deploy.env
      metrics: metrics.txt

Deploy Monitoring:
  extends: .stack_template
  environment:
    name: $ENV_BRANCH_NAME/deploy-monitoring
    auto_stop_in: 2 weeks
  rules:
    - if: '$ENV_BRANCH_NAME == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
    - if: '$ENV_BRANCH_NAME =~ /^devel-/ || $ENV_BRANCH_NAME =~ /^review-/ ||  $ENV_BRANCH_NAME == "catprod-preview"'
  needs:
    - job: Set Stack Name
      artifacts: true
    - Build Monitoring Image
    - Deploy Compose Files
    - Deploy Internal Network
  script:
    - bash ./cicd/deploy-monitoring

Verify Docker Health:
  extends: .stack_template
  environment:
    name: $ENV_BRANCH_NAME/verify
    auto_stop_in: 2 weeks
  timeout: 40m
  needs:
    - job: Set Stack Name
      artifacts: true
    - job: Deploy Compose Files
      artifacts: true
    - Deploy Monitoring
    - Deploy Vufind
  script:
    - bash ./cicd/verify-docker-health

Verify Solr Health:
  extends: .stack_template
  environment:
    name: $ENV_BRANCH_NAME/verify
    auto_stop_in: 2 weeks
  timeout: 40m
  needs:
    - job: Set Stack Name
      artifacts: true
    - job: Deploy Compose Files
      artifacts: true
    - Create Solr Collections
  script:
    - bash ./cicd/verify-solr-health

Verify DB Health:
  extends: .stack_template
  environment:
    name: $ENV_BRANCH_NAME/verify
    auto_stop_in: 2 weeks
  timeout: 40m
  needs:
    - job: Set Stack Name
      artifacts: true
    - job: Deploy Compose Files
      artifacts: true
    - Deploy DB
  script:
    - bash ./cicd/verify-db-health

Populate Vufind Environment:
  extends: .stack_template
  environment:
    name: $ENV_BRANCH_NAME/populate
    auto_stop_in: 2 weeks
  timeout: 10m
  rules:
    - if: '($ENV_BRANCH_NAME =~ /^devel-/ || $ENV_BRANCH_NAME =~ /^review-/) && $CI_PIPELINE_SOURCE != "schedule"'
  needs:
    - job: Set Stack Name
      artifacts: true
    - Verify Docker Health
  script:
    - bash ./cicd/populate-vufind-environment

Populate Course Reserves:
  extends: .stack_template
  stage: Optional Steps
  environment:
    name: $ENV_BRANCH_NAME/populate-reserves
    auto_stop_in: 2 weeks
  variables:
    RUNNER_SCRIPT_TIMEOUT: 90m
  timeout: 90m
  rules:
    - if: '($ENV_BRANCH_NAME =~ /^devel-/ || $ENV_BRANCH_NAME =~ /^review-/) && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
  needs:
    - job: Set Stack Name
      artifacts: true
    - Verify Docker Health
  script:
    - bash ./cicd/populate-coursereserves

Run Cache Clear:
  extends: .stack_template
  environment:
    name: $ENV_BRANCH_NAME/run-cache-clear
    auto_stop_in: 2 weeks
  rules:
    - if: '$ENV_BRANCH_NAME == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
    - if: '$ENV_BRANCH_NAME == "catprod-preview"'
  needs:
    - job: Set Stack Name
      artifacts: true
    - Verify Docker Health
  script:
    - bash ./cicd/clear-cache

Run Functional Tests:
  extends: .stack_template
  environment:
    name: $ENV_BRANCH_NAME/run-tests
    auto_stop_in: 2 weeks
  rules:
    - if: '$ENV_BRANCH_NAME == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
    - if: '$ENV_BRANCH_NAME == "catprod-preview"'
  needs:
    - job: Set Stack Name
      artifacts: true
    - Run Cache Clear
  script:
    - bash ./cicd/run-functional-tests

Remove Environment:
  stage: Cleanup
  extends: .stack_template
  image: $CI_REGISTRY_IMAGE/ansible:latest
  environment:
    name: $ENV_BRANCH_NAME
    action: stop
  rules:
    - if: '($ENV_BRANCH_NAME =~ /^devel-/ || $ENV_BRANCH_NAME =~ /^review-/) && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
  needs:
    - job: Set Stack Name
      artifacts: true
  script:
    - ./cicd/remove-environment

Cleanup Files:
  stage: Cleanup
  extends: .stack_template
  image: $CI_REGISTRY_IMAGE/ansible:latest
  environment:
    name: $ENV_BRANCH_NAME/cleanup-files
  rules:
    - if: '($ENV_BRANCH_NAME =~ /^devel-/ || $ENV_BRANCH_NAME =~ /^review-/) && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
  needs:
    - job: Set Stack Name
      artifacts: true
    - Remove Environment
  script:
    - ./cicd/cleanup-files

############# Templates ###############

.stack_template:
  stage: Deploy
  tags:
    - msul-shared
  retry: 2
  interruptible: true
  timeout: 60m
  variables:
    ENCODED_PRIVATE_KEY: $DEPLOY_PRIVATE_KEY
    SERVER: $DEPLOY_HOST_1
    RUNNER_SCRIPT_TIMEOUT: 60m # Prevent job timeout when deploy script takes longer than the 5m default
  rules:
    - if: '$ENV_BRANCH_NAME == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
    - if: '$ENV_BRANCH_NAME =~ /^devel-/ || $ENV_BRANCH_NAME =~ /^review-/ ||  $ENV_BRANCH_NAME == "catprod-preview"'
  needs:
    - job: Set Stack Name
      artifacts: true
    - Deploy Compose Files
  before_script:
    - apk add --no-cache bash || true
  artifacts:
    reports:
      metrics: metrics.txt

include:
  - 'templates/*.gitlab-ci.yml'
