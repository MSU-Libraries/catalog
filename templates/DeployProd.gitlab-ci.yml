############# Prod Deploy ###############
Begin Prod Deploy:
  stage: Deploy Prod
  extends: Set Stack Name
  needs:
    - Verify Docker Health
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PROD == "true" && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
  variables:
    PROD: "true"

Deploy Prod Compose Files:
  stage: Deploy Prod
  environment:
    name: $ENV_BRANCH_NAME-prod/deploy-compose
    auto_stop_in: 2 weeks
  extends: Deploy Compose Files
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
  needs:
    - job: Begin Prod Deploy
      artifacts: true

Deploy Prod Internal Network:
  stage: Deploy Prod
  extends: Deploy Internal Network
  environment:
    name: $ENV_BRANCH_NAME-prod/deploy-network
    auto_stop_in: 2 weeks
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
  needs:
    - job: Begin Prod Deploy
      artifacts: true
    - Deploy Prod Compose Files

Initialize Prod Log Dirs:
  stage: Deploy Prod
  extends: Initialize Log Dirs
  environment:
    name: $ENV_BRANCH_NAME-prod/deploy-network
    auto_stop_in: 2 weeks
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
  needs:
    - job: Begin Prod Deploy
      artifacts: true
    - Deploy Prod Internal Network

Bootstrap Prod Stacks:
  stage: Deploy Prod
  environment:
    name: $ENV_BRANCH_NAME-prod/bootstrap
    auto_stop_in: 2 weeks
  extends: Bootstrap Stacks
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
  needs:
    - job: Begin Prod Deploy
      artifacts: true
    - Deploy Prod Compose Files
    - Deploy Prod Internal Network

Deploy Prod ZK:
  stage: Deploy Prod
  extends: Deploy ZK
  environment:
    name: $ENV_BRANCH_NAME-prod/deploy-zk
    auto_stop_in: 2 weeks
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
  needs:
    - job: Begin Prod Deploy
      artifacts: true
    - Bootstrap Prod Stacks

Deploy Prod Solr:
  stage: Deploy Prod
  extends: Deploy Solr
  environment:
    name: $ENV_BRANCH_NAME-prod/deploy-solr
    auto_stop_in: 2 weeks
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
  needs:
    - job: Begin Prod Deploy
      artifacts: true
    - Deploy Prod ZK
    - Bootstrap Prod Stacks

Create Prod Solr Collections:
  stage: Deploy Prod
  extends: Create Solr Collections
  environment:
    name: $ENV_BRANCH_NAME-prod/create-solr-colls
    auto_stop_in: 2 weeks
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
  needs:
    - job: Set Stack Name
      artifacts: true
    - job: Deploy Prod Compose Files
      artifacts: true
    - Deploy Prod Solr

Deploy Prod DB:
  stage: Deploy Prod
  extends: Deploy DB
  environment:
    name: $ENV_BRANCH_NAME-prod/deploy-db
    auto_stop_in: 2 weeks
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
  needs:
    - job: Begin Prod Deploy
      artifacts: true
    - Bootstrap Prod Stacks
    - Initialize Prod Log Dirs

Deploy Prod Redis:
  stage: Deploy Prod
  extends: Deploy Redis
  environment:
    name: $ENV_BRANCH_NAME-prod/deploy-redis
    auto_stop_in: 2 weeks
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
  needs:
    - job: Begin Prod Deploy
      artifacts: true

Deploy Prod Vufind:
  stage: Deploy Prod
  extends: Deploy Vufind
  environment:
    name: $ENV_BRANCH_NAME-prod/deploy-vufind
    auto_stop_in: 2 weeks
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
  needs:
    - job: Begin Prod Deploy
      artifacts: true
    - Verify Prod DB Health
    - Verify Prod Solr Health

Deploy Prod Vufind Build Env:
  extends: Deploy Vufind Build Env
  environment:
    name: $ENV_BRANCH_NAME-prod/deploy-buildenv
    auto_stop_in: 2 weeks
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
  needs:
    - job: Begin Prod Deploy
      artifacts: true
    - Deploy Prod Vufind

Deploy Prod Monitoring:
  stage: Deploy Prod
  extends: Deploy Monitoring
  environment:
    name: $ENV_BRANCH_NAME-prod/deploy-monitoring
    auto_stop_in: 2 weeks
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
  needs:
    - job: Begin Prod Deploy
      artifacts: true
    - Deploy Prod Internal Network

Verify Prod Docker Health:
  stage: Deploy Prod
  extends: Verify Docker Health
  environment:
    name: $ENV_BRANCH_NAME-prod/verify
    auto_stop_in: 2 weeks
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
  needs:
    - job: Begin Prod Deploy
      artifacts: true
    - job: Deploy Prod Compose Files
      artifacts: true
    - Deploy Prod Monitoring
    - Deploy Prod Vufind

Verify Prod Solr Health:
  stage: Deploy Prod
  extends: Verify Solr Health
  environment:
    name: $ENV_BRANCH_NAME-prod/verify
    auto_stop_in: 2 weeks
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
  needs:
    - job: Set Stack Name
      artifacts: true
    - job: Deploy Prod Compose Files
      artifacts: true
    - Create Prod Solr Collections

Verify Prod DB Health:
  stage: Deploy Prod
  extends: Verify DB Health
  environment:
    name: $ENV_BRANCH_NAME-prod/verify
    auto_stop_in: 2 weeks
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
  needs:
    - job: Set Stack Name
      artifacts: true
    - job: Deploy Prod Compose Files
      artifacts: true
    - Deploy Prod DB

Prod Run Cache Clear:
  stage: Deploy Prod
  extends: Run Cache Clear
  environment:
    name: $ENV_BRANCH_NAME-prod/run-cache-clear
    auto_stop_in: 2 weeks
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
  needs:
    - job: Begin Prod Deploy
      artifacts: true
    - Verify Prod Docker Health

Prod Run Functional Tests:
  stage: Deploy Prod
  extends: Run Functional Tests
  environment:
    name: $ENV_BRANCH_NAME-prod/run-tests
    auto_stop_in: 2 weeks
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "schedule"'
  needs:
    - job: Begin Prod Deploy
      artifacts: true
    - Prod Run Cache Clear
