ServerName catalog.lib.msu.edu
<VirtualHost *:80>
    LogLevel warn
    # Setup Apache logging to both stdout/stderr and log files (needed for monitoring app)
    ErrorLog "|/usr/bin/tee /var/log/apache2/error.log"
    CustomLog "|/usr/bin/tee /var/log/apache2/access.log" combined

    RewriteEngine On
    RewriteMap cidrcheck "prg:/usr/local/bin/cidr_checker -a /etc/apache2/ipallowlist.txt /etc/apache2/ipblocklist/inbound.txt"
    RewriteCond ${cidrcheck:%{REMOTE_ADDR}} =PROXY
    RewriteRule ^/(.*)$ http://no-access_pages:80/access-limited/ [P,L]

    <Directory /usr/local/vufind/public/>
        Require all granted
    </Directory>
</VirtualHost>
