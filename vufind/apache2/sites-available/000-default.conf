ServerName catalog.lib.msu.edu
MaxRequestWorkers 2048
ServerLimit 2048
<VirtualHost *:80>
    LogLevel warn
    # Setup Apache logging to both stdout/stderr and log files (needed for monitoring app)
    ErrorLog "|/usr/bin/tee -a /var/log/apache2/error.log"
    CustomLog "|/usr/bin/tee -a /var/log/apache2/access.log" combined

    Alias /favicon.ico /usr/local/vufind/themes/msul/images/msul-favicon.ico

    RewriteEngine On

    # Block bots sending bad URLs for facet lists or covers
    RewriteCond %{REQUEST_URI} ^/(Search|Author)/FacetList
    RewriteCond %{QUERY_STRING} !facet=\w
    RewriteRule ^ - [F,END]
    RewriteCond %{REQUEST_URI} ^/Cover/Show
    RewriteCond %{QUERY_STRING} !source=\w
    RewriteRule ^ - [F,END]
    # Block some EDS bot requests
    RewriteCond %{REQUEST_URI} ^/EDS/Search$
    RewriteCond %{QUERY_STRING} ^dfApplied=1&.*&lookfor=[^&]+&type=(SU|AU)(&view=[^&]+)?$
    RewriteRule ^ - [F,END]
    # Start with EdsRecord or Record, then anything but a slash followed by /SMS
    RewriteCond %{REQUEST_URI} ^/(Eds)?Record/[^/]+/SMS
    RewriteRule ^ - [G,END]
    # Block /EdsRecord/EDS/Search
    RewriteCond %{REQUEST_URI} ^/EdsRecord/EDS/Search
    RewriteRule ^ - [F,END]

    # Validate requests against the ip block and allow lists
    RewriteMap cidrcheck "prg:/usr/local/bin/cidr_checker -v -a /etc/apache2/ipallowlist.txt /etc/apache2/ipblocklist/inbound.txt"
    RewriteCond ${cidrcheck:%{REMOTE_ADDR}} =PROXY
    RewriteRule ^/(.*)$ http://no-access_pages:80/access-limited/ [QSD,P,END]

    # Filter requests from sources of problem traffic when loadavg is high
    RewriteMap loadfilter "prg:/usr/local/bin/loadavg_filter -v -m /etc/apache2/master-geo-list.csv -c /etc/apache2/filter_cc.txt -a /etc/apache2/filter_asn.txt -f 3.5 -o 6.0 -r 1.5 -l 5"
    RewriteCond ${loadfilter:%{REMOTE_ADDR}} =LIMIT
    RewriteRule ^/(.*)$ http://no-access_pages:80/heavy-load/ [QSD,P,END]

    <Directory /usr/local/vufind/public/>
        Require all granted
    </Directory>
</VirtualHost>
