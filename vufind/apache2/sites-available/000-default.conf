ServerName catalog.lib.msu.edu
MaxRequestWorkers 1024
ServerLimit 1024
<VirtualHost *:80>
    LogLevel warn
    # Setup Apache logging to both stdout/stderr and log files (needed for monitoring app)
    ErrorLog "|/usr/bin/tee /var/log/apache2/error.log"
    CustomLog "|/usr/bin/tee /var/log/apache2/access.log" combined

    RewriteEngine On

    RewriteCond %{REQUEST_URI} ^/favicon\.ico$
    RewriteRule ^ - [END,R=404]

    # Block bots sending bad URLs for facet lists or covers
    RewriteCond %{REQUEST_URI} ^/(Search|Author)/FacetList
    RewriteCond %{QUERY_STRING} !facet=\w
    RewriteRule ^ - [F,END]
    RewriteCond %{REQUEST_URI} ^/Cover/Show
    RewriteCond %{QUERY_STRING} !source=\w
    RewriteRule ^ - [F,END]
    RewriteCond %{REQUEST_URI} ^/Record/\w+\.\w+/SMS
    RewriteRule ^ - [G,END]

    # Validate requests against the ip block and allow lists
    RewriteMap cidrcheck "prg:/usr/local/bin/cidr_checker -v -a /etc/apache2/ipallowlist.txt /etc/apache2/ipblocklist/inbound.txt"
    RewriteCond ${cidrcheck:%{REMOTE_ADDR}} =PROXY
    RewriteRule ^/(.*)$ http://no-access_pages:80/access-limited/ [QSD,P,END]

    # Filter requests from sources of problem traffic when loadavg is high
    RewriteMap loadfilter "prg:/usr/local/bin/loadavg_filter -v -m /etc/apache2/master_network.csv -c /etc/apache2/filter_cc.txt -a /etc/apache2/filter_asn.txt -f 4.5 -o 6.5 -r 1.0"
    RewriteCond ${loadfilter:%{REMOTE_ADDR}} =LIMIT
    RewriteRule ^/(.*)$ http://no-access_pages:80/heavy-load/ [QSD,P,END]

    <Directory /usr/local/vufind/public/>
        Require all granted
    </Directory>
</VirtualHost>
