# Drop connections from URLs which only bots make use of
SecRule REQUEST_URI "@rx ^/(?:Search|Author)/FacetList" \
    "id:10000,\
    phase:1,\
    deny,\
    drop,\
    log,\
    msg:'Connection dropped due to known bot URI pattern (FacetList)',\
    chain"
    SecRule QUERY_STRING "!@rx facet=\w"

SecRule REQUEST_URI "@rx ^/Cover/Show" \
    "id:10001,\
    phase:1,\
    deny,\
    drop,\
    log,\
    msg:'Connection dropped due to known bot URI pattern (Cover/Show)',\
    chain"
    SecRule QUERY_STRING "!@rx source=\w"

SecRule REQUEST_URI "@rx ^/EdsRecord/EDS/Search" \
    "id:10002,\
    phase:1,\
    deny,\
    drop,\
    log,\
    msg:'Connection dropped due to known bot URI pattern (EDS/Search)'"
